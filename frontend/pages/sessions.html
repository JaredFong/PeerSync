<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Sessions — PeerSync
  </title>
  <link href="../css/styles.css" rel="stylesheet"/>
 </head>
 <body>
  <header>
   <a class="brand" href="dashboard.html">
    PeerSync
   </a>
   <nav>
    <a href="dashboard.html">
     Home
    </a>
    <a href="profile.html">
     Profile
    </a>
    <a href="requests.html">
     Support
    </a>
    <a class="selected" href="sessions.html">
     Sessions
    </a>
    <a href="feedback.html">
     Feedback
    </a>
   </nav>
   <button class="secondary" id="signout">
    Sign out
   </button>
  </header>
  <main>
   <span class="eyebrow">
    SUPPORT ARRANGEMENTS
   </span>
   <h1>
    My Support Sessions
   </h1>
   <p class="muted">
    Accepted support requests appear here. Mark a request completed after the support has taken place so the student can leave feedback.
   </p>
   <section class="panel">
    <h2>
     Upcoming
    </h2>
    <div class="cards" id="upcoming-list">
    </div>
   </section>
   <section class="panel">
    <h2>
     Past
    </h2>
    <div class="cards" id="past-list">
    </div>
   </section>

   <div class="edit-request-container hidden" id="reschedule-form-container">
    <h2>Reschedule Request</h2>
    
    <form id="reschedule-form">
        <div class="form-group">
            <label for="reschedule-type">Request Type</label>
            <select id="reschedule-type" name="requestType" disabled style="background-color: #f0f2f5; cursor: not-allowed; color: #7b818c;">
                <option value="academic">Academic</option>
                <option value="technical">Technical</option>
                <option value="other">Other</option>
            </select>
        </div>

        <div class="form-group">
            <label for="reschedule-title">Title</label>
            <input type="text" id="reschedule-title" name="title" disabled style="background-color: #f0f2f5; cursor: not-allowed; color: #7b818c;">
        </div>

        <div class="form-group">
            <label for="reschedule-desc">Description</label>
            <textarea id="reschedule-desc" name="description" rows="5" disabled style="background-color: #f0f2f5; cursor: not-allowed; color: #7b818c;"></textarea>
        </div>

        <div class="form-group">
            <label>Preferred Support Mode</label>
            <div class="radio-group">
                <label>
                    <input type="radio" name="supportMode" value="online" checked>
                    Online
                </label>
                <label>
                    <input type="radio" name="supportMode" value="face-to-face">
                    Face-to-face
                </label>
            </div>
        </div>

        <div class="two">
            <div class="form-group">
                <label for="reschedule-date">Preferred date</label>
                <input type="date" id="reschedule-date" name="preferredDate">
            </div>
            <div class="form-group">
                <label for="reschedule-clock">Preferred time</label>
                <input type="time" id="reschedule-clock" name="preferredClock">
            </div>
        </div>
        <div class="form-actions">
            <button type="button" class="btn-cancel" id="close-reschedule-btn">Cancel</button>
            <button type="submit" class="btn-save">Save</button>
        </div>
    </form>
   </div>

   <p id="page-message" role="status">
   </p>
  </main>
  <script src="../js/shared.js">
  </script>
  <script src="../js/sessions.js">
  </script>
 </body>
</html>
